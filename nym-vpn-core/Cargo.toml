nym-offline-monitor = { path = "crates/nym-offline-monitor" }
nym-platform-metadata = { path = "crates/nym-platform-metadata" }
nym-routing = { path = "crates/nym-routing" }
nym-statistics = { path = "crates/nym-statistics" }
nym-statistics-api-client = { path = "crates/nym-statistics-api-client" }
nym-vpn-account-controller = { path = "crates/nym-vpn-account-controller" }
nym-vpn-api-client = { path = "crates/nym-vpn-api-client" }
nym-vpn-lib = { path = "crates/nym-vpn-lib" }
nym-vpn-lib-types = { path = "crates/nym-vpn-lib-types" }
nym-vpn-network-config = { path = "crates/nym-vpn-network-config" }
nym-vpn-proto = { path = "crates/nym-vpn-proto" }
nym-vpn-store = { path = "crates/nym-vpn-store" }
nym-wg-gotatun = { path = "crates/nym-wg-gotatun" }
# Pinned past a89bba82 ("Fix clearing of expected incoming handshake early"):
# the prior pin (3969d36) purged in-flight handshake indices every 250ms,
# silently dropping exit-hop handshake responses and forcing a 5s rekey wait
# on nearly every two-hop connect.
gotatun = { git = "https://github.com/mullvad/gotatun", rev = "a89bba825c1f4154eb0b5f0ef2ee4fe7888b4378", features = ["device", "tun"] }
nym-wg-metadata-client = { path = "crates/nym-wg-metadata-client" }

