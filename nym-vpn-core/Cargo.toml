[workspace]
resolver = "2"
members = [
    "crates/nym-common",
    "crates/nym-connection-monitor",
    "crates/nym-diagnostic",
    "crates/nym-dbus",
    "crates/nym-dns",
    "crates/nym-firewall",
    "crates/nym-gateway-directory",
    "crates/nym-ipc",
    "crates/nym-offline-monitor",
    "crates/nym-platform-metadata",
    "crates/nym-routing",
    "crates/nym-statistics",
    "crates/nym-statistics-api-client",
    "crates/nym-vpn-account-controller",
    "crates/nym-vpn-api-client",
    "crates/nym-vpn-lib-types",
    "crates/nym-vpn-lib",
    "crates/nym-vpn-network-config",
    "crates/nym-vpn-proto",
    "crates/nym-vpn-store",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
    "crates/nym-wg-gotatun",
    "crates/nym-wg-metadata-client",
    "crates/nym-firewall-config",
]

default-members = [
    "crates/nym-diagnostic",
    "crates/nym-vpnc",
    "crates/nym-vpnd",
]

[workspace.package]
version = "1.31.0"
authors = ["dial0ut"]
repository = "https://github.com/dial0ut/nym-vpn-openwrt"
homepage = "https://docs.dial0ut.org"
documentation = "https://docs.dial0ut.org"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 2

[workspace.lints.clippy]
large_futures = "warn"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0.101"
async-stream = "0.3.6"
async-trait = "0.1.89"
backon = "1.6"
base64 = "0.22"
base64-url = "3.0.2"
bincode = "1.3.3"
bip39 = "2.2"
bitflags = "2"
boringtun = "0.7.0"
bs58 = "0.5.1"
bytes = "1.11"
chrono = "0.4.42"
celes = "2.6.0"
clap = "4.5"
dbus = {version = "0.9.10", features = ["vendored"]}
duct = "1.1"
ed25519-dalek = "2.2.0"
futures = "0.3.32"
futures-util = "0.3"
iprange = "0.6.7"
ipnet = "2.11.0"
hex = "0.4"
hickory-resolver = "0.25"
hickory-server = "0.25"
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false }
hyper = "1.8.1"
hyper-util = "0.1"
http-body-util = "0.1"
urlencoding = "2.1"
inotify = "0.11"
ipnetwork = "0.21.1"
itertools = "0.14.0"
libc = "0.2"
log = "0.4.29"
log-panics = "2"
mnl = "0.2.2"
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.25.1"
netlink-sys = "0.8.7"
nftnl = "0.7.0"
nix = "0.31.1"
once_cell = "1.21"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
pnet = { version = "0.35.0", default-features = false }
pnet_packet = "0.35.0"
prost = "0.14.3"
prost-types = "0.14.3"
pretty_assertions = "1.4.1"
quinn = { version = "0.11", default-features = false, features = [
    "ring",
    "rustls",
    "runtime-tokio",
] }
quinn-proto = { version = "0.11", default-features = false, features = [
    "rustls",
] }
rand = "0.8.5"
rand_chacha = "0.3.1"
resolv-conf = "0.7"
rs-release = "0.1.11"
rtnetlink = "0.18"
rustls = { version = "0.23.36", default-features = false }
semver = "1.0"
sentry = { version = "0.46.2", default-features = false }
serde = "1.0"
serde_json = "1.0"
serial_test = "3.3.1"
sha2 = "0.10"
sha256 = "1.6.0"
si-scale = "0.3.0"
signature = "2.2.0"
sqlx = "0.8.6"
socket2 = "0.6.2"
surge-ping = "0.8.4"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
sysinfo = "0.38"
tap = "1.0.1"
tempfile = "3.25"
tabled = "0.20"
thiserror = "2.0"
time = "0.3.47"
tokio = "1.49"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.28" }
