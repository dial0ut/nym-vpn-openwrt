tonic-prost = "0.14.4"
tonic-prost-build = "0.14.4"
typed-builder = "0.23.2"
ts-rs = "12.0.1"
tower = "0.5.3"
tracing = "0.1"
tracing-appender = "0.2.4"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.6"
triggered = "0.1.3"
tun = { version = "0.8.5", features = ["async"] }
url = "2.5"
vergen-gitcl = { version = "9.1.0", default-features = false }
verifysign = "0.2.5"
webpki-roots = "1.0"
which = "8.0"
wiremock = "0.6.5"
x25519-dalek = "2.0"
x509-parser = "0.18.1"
zeroize = "1.8.2"

nym-common = { path = "crates/nym-common" }
nym-connection-monitor = { path = "crates/nym-connection-monitor" }
