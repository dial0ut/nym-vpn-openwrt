# Keeps the SHA-pinned actions and the Tier 3 base image digests from going
# stale. One grouped PR per ecosystem per month; the cross-build in ci.yml
# exercises a Tier 3 image bump. The Tier 2 image digests in
# scripts/ci/targets.json and RUST_NIGHTLY in scripts/versions.sh are bumped
# by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker/tier3-musl
    schedule:
      interval: monthly
    groups:
      tier3-images:
        patterns: ['*']
