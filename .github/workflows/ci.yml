name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Shellcheck
        run: scripts/security/shellcheck.sh

      - name: Install build dependencies
        # protoc plus the google/protobuf well-known-type includes for
        # nym-vpn-proto.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            protobuf-compiler libprotobuf-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: nym-vpn-core

      - name: Allow unprivileged ICMP sockets
        # The connection-monitor loopback probe tests open ICMP datagram
        # sockets, which the runner's default ping_group_range forbids for
        # non-root users.
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Run tests
        working-directory: nym-vpn-core
        run: cargo test --workspace --locked --no-fail-fast

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: 1.30.0
          # Fail the job on findings instead of uploading SARIF.
          advanced-security: false
          # Informational findings (e.g. static matrix values in run: blocks) don't block.
          min-severity: low
