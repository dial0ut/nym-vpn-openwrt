# Build and release musl binaries for OpenWrt/Linux
name: Release musl binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.21.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard targets - use stock messense/rust-musl-cross images
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            docker_image: messense/rust-musl-cross:x86_64-musl
            custom: false
          - target: i686-unknown-linux-musl
            arch: i686
            docker_image: messense/rust-musl-cross:i686-musl
            custom: false
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            docker_image: messense/rust-musl-cross:aarch64-musl
            custom: false
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            docker_image: messense/rust-musl-cross:armv7-musleabihf
            custom: false
          # Extended targets - require custom Docker images (portable-atomic patches, linker fixes)
          - target: mips-unknown-linux-musl
            arch: mips
            dockerfile: Dockerfile.mips
            custom: true
          - target: mipsel-unknown-linux-musl
            arch: mipsel
            dockerfile: Dockerfile.mipsel
            custom: true
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            dockerfile: Dockerfile.riscv64
            custom: true
          - target: armv5te-unknown-linux-musleabi
            arch: armv5te
            dockerfile: Dockerfile.armv5te
            custom: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        if: matrix.custom
        uses: docker/setup-buildx-action@v3

      - name: Build custom Docker image
        if: matrix.custom
        run: |
          cd docker/tier3-musl
          docker build -f ${{ matrix.dockerfile }} -t nym-musl-cross:${{ matrix.arch }}-musl .

      - name: Build (standard)
        if: ${{ !matrix.custom }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            -e TARGET=${{ matrix.target }} \
            -e RUSTFLAGS_EXTRA="${{ matrix.rustflags_extra }}" \
            ${{ matrix.docker_image }} \
            bash /home/rust/src/scripts/cross-compile-musl.sh

      - name: Build (custom)
        if: matrix.custom
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            nym-musl-cross:${{ matrix.arch }}-musl \
            /opt/build-tier3.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnd artifacts/nym-vpnd-${{ matrix.arch }}
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnc artifacts/nym-vpnc-${{ matrix.arch }}

          # Create tarball
          cd artifacts
          tar -czvf nym-vpn-${{ matrix.arch }}.tar.gz nym-vpnd-${{ matrix.arch }} nym-vpnc-${{ matrix.arch }}

          # Generate checksums
          sha256sum nym-vpnd-${{ matrix.arch }} > nym-vpnd-${{ matrix.arch }}.sha256
          sha256sum nym-vpnc-${{ matrix.arch }} > nym-vpnc-${{ matrix.arch }}.sha256
          sha256sum nym-vpn-${{ matrix.arch }}.tar.gz > nym-vpn-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 7

  package-ipk:
    name: Create IPK packages
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            openwrt_arch: aarch64_generic
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a53
          - arch: x86_64
            openwrt_arch: x86_64
          - arch: i686
            openwrt_arch: i386_pentium4
          - arch: armv7
            openwrt_arch: arm_cortex-a7_neon-vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a9_vfpv3-d16
          - arch: armv5te
            openwrt_arch: arm_cortex-a9
          - arch: armv5te
            openwrt_arch: arm_arm926ej-s
          - arch: mips
            openwrt_arch: mips_24kc
          - arch: mipsel
            openwrt_arch: mipsel_24kc
          - arch: mipsel
            openwrt_arch: mips_siflower
          - arch: riscv64
            openwrt_arch: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip 'v' prefix for package version
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Clone LuCI package
        run: |
          git clone --depth 1 https://github.com/dial0ut/nym-vpn-luci.git luci

      - name: Create IPK package
        run: |
          PKG_VERSION="${{ steps.version.outputs.version }}"
          PKG_ARCH="${{ matrix.openwrt_arch }}"
          mkdir -p ipk/{control,data}

          # === Binaries ===
          mkdir -p ipk/data/usr/sbin ipk/data/usr/bin
          cp artifacts/nym-vpnd-${{ matrix.arch }} ipk/data/usr/sbin/nym-vpnd
          cp artifacts/nym-vpnc-${{ matrix.arch }} ipk/data/usr/bin/nym-vpnc
          chmod 755 ipk/data/usr/sbin/nym-vpnd ipk/data/usr/bin/nym-vpnc

          # === LuCI web interface ===
          # Frontend JS - view file
          mkdir -p ipk/data/www/luci-static/resources/view/nym-vpn
          cp luci/htdocs/luci-static/resources/view/nym-vpn/config.js \
             ipk/data/www/luci-static/resources/view/nym-vpn/

          # Frontend JS - module files (rpc, ui, countries, assets, theme)
          mkdir -p ipk/data/www/luci-static/resources/nym-vpn
          cp luci/htdocs/luci-static/resources/nym-vpn/*.js \
             ipk/data/www/luci-static/resources/nym-vpn/

          # RPC backend
          mkdir -p ipk/data/usr/libexec/rpcd
          cp luci/root/usr/libexec/rpcd/nym-vpn ipk/data/usr/libexec/rpcd/
          chmod 755 ipk/data/usr/libexec/rpcd/nym-vpn

          # Menu and ACL config
          mkdir -p ipk/data/usr/share/luci/menu.d ipk/data/usr/share/rpcd/acl.d
          cp luci/root/usr/share/luci/menu.d/luci-app-nym-vpn.json ipk/data/usr/share/luci/menu.d/
          cp luci/root/usr/share/rpcd/acl.d/luci-app-nym-vpn.json ipk/data/usr/share/rpcd/acl.d/

          # === Service config ===
          mkdir -p ipk/data/etc/init.d ipk/data/etc/config ipk/data/etc/uci-defaults
          mkdir -p ipk/data/var/lib/nym-vpn

          # Init script from LuCI repo (or create if not present)
          if [ -f luci/root/etc/init.d/nym-vpnd ]; then
            cp luci/root/etc/init.d/nym-vpnd ipk/data/etc/init.d/
          else
            cat > ipk/data/etc/init.d/nym-vpnd << 'INITEOF'
          #!/bin/sh /etc/rc.common
          START=90
          STOP=10
          USE_PROCD=1

          start_service() {
              mkdir -p /var/lib/nym-vpn
              procd_open_instance
              procd_set_param command /usr/sbin/nym-vpnd --config-dir /var/lib/nym-vpn
              procd_set_param respawn 3600 5 5
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_set_param pidfile /var/run/nym-vpnd.pid
              procd_close_instance
          }

          stop_service() {
              /usr/bin/nym-vpnc disconnect 2>/dev/null || true
          }
          INITEOF
          fi
          chmod 755 ipk/data/etc/init.d/nym-vpnd

          # UCI defaults (post-install setup)
          if [ -f luci/root/etc/uci-defaults/luci-app-nym-vpn ]; then
            cp luci/root/etc/uci-defaults/luci-app-nym-vpn ipk/data/etc/uci-defaults/
            chmod 755 ipk/data/etc/uci-defaults/luci-app-nym-vpn
          fi

          # UCI config
          cat > ipk/data/etc/config/nym-vpn << 'CONFIGEOF'
          config nym-vpn 'settings'
              option enabled '0'
              option network 'mainnet'
          CONFIGEOF

          # === Firewall include scripts ===
          mkdir -p ipk/data/usr/share/nym-vpn
          cp nym-vpn-core/crates/nym-firewall/scripts/fw3-include.sh ipk/data/usr/share/nym-vpn/
          cp nym-vpn-core/crates/nym-firewall/scripts/fw4-include.sh ipk/data/usr/share/nym-vpn/
          chmod 755 ipk/data/usr/share/nym-vpn/*.sh

          # === Control file ===
          INSTALLED_SIZE=$(du -sk ipk/data | cut -f1)
          cat > ipk/control/control << EOF
          Package: nym-vpn
          Version: ${PKG_VERSION}
          Architecture: ${PKG_ARCH}
          Maintainer: Nym Technologies <support@nymtech.net>
          Installed-Size: ${INSTALLED_SIZE}
          Section: net
          Priority: optional
          Depends: libc, wireguard-tools, kmod-wireguard, kmod-tun, luci-base, rpcd
          Description: NymVPN for OpenWrt
           Privacy-focused VPN using the Nym mixnet. Includes daemon, CLI, and LuCI web interface.
          EOF

          # === Post-install script ===
          cat > ipk/control/postinst << 'POSTINST'
          #!/bin/sh
          # Create TUN device if it doesn't exist
          mkdir -p /dev/net
          [ ! -c /dev/net/tun ] && mknod /dev/net/tun c 10 200
          chmod 600 /dev/net/tun

          # Enable and start the service
          /etc/init.d/nym-vpnd enable
          /etc/init.d/nym-vpnd start

          # Restart rpcd to pick up new ACLs
          /etc/init.d/rpcd restart

          exit 0
          POSTINST
          chmod 755 ipk/control/postinst

          # === Pre-remove script ===
          cat > ipk/control/prerm << 'PRERM'
          #!/bin/sh
          # Stop and disable the service before removal
          /etc/init.d/nym-vpnd stop 2>/dev/null
          /etc/init.d/nym-vpnd disable 2>/dev/null

          # Clean up firewall rules
          if [ -x /sbin/fw4 ]; then
            # fw4/nftables cleanup
            nft delete table inet nym 2>/dev/null
            # Remove rules from fw4 chains (srcnat, forward_lan)
            for chain in srcnat forward_lan; do
              handles=$(nft -a list chain inet fw4 "$chain" 2>/dev/null | grep "nym-vpn:" | sed 's/.*handle //')
              for h in $handles; do
                nft delete rule inet fw4 "$chain" handle "$h" 2>/dev/null
              done
            done
          else
            # fw3/iptables cleanup
            for ipt in iptables ip6tables; do
              # Remove jump rules from fw3 hook chains
              for hook in input_rule output_rule forwarding_rule; do
                $ipt -D "$hook" -j NYM_INPUT 2>/dev/null
                $ipt -D "$hook" -j NYM_OUTPUT 2>/dev/null
                $ipt -D "$hook" -j NYM_FORWARD 2>/dev/null
              done
              # Flush and delete our chains
              for chain in NYM_INPUT NYM_OUTPUT NYM_FORWARD; do
                $ipt -F "$chain" 2>/dev/null
                $ipt -X "$chain" 2>/dev/null
              done
            done
            # Remove masquerade rules from NAT table
            for num in $(iptables -t nat -L POSTROUTING -n --line-numbers -v 2>/dev/null | grep "nym-vpn" | awk '{print $1}' | sort -rn); do
              iptables -t nat -D POSTROUTING "$num" 2>/dev/null
            done
          fi

          # Remove UCI firewall include config
          uci delete firewall.nym_vpn 2>/dev/null
          uci commit firewall 2>/dev/null

          # Remove UCI app config
          uci delete nym-vpn 2>/dev/null
          uci commit nym-vpn 2>/dev/null
          rm -f /etc/config/nym-vpn 2>/dev/null

          # Clean up all nym-vpn data and config files
          rm -rf /var/lib/nym-vpn 2>/dev/null

          exit 0
          PRERM
          chmod 755 ipk/control/prerm

          # === Build IPK ===
          (cd ipk/control && tar -czf ../control.tar.gz .)
          (cd ipk/data && tar -czf ../data.tar.gz .)
          echo "2.0" > ipk/debian-binary
          (cd ipk && tar -czf ../nym-vpn_${PKG_VERSION}_${PKG_ARCH}.ipk ./debian-binary ./control.tar.gz ./data.tar.gz)
          ls -la *.ipk

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.openwrt_arch }}
          path: "*.ipk"
          retention-days: 7

  release:
    name: Create Release
    needs: [build, package-ipk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Nym VPN ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            artifacts/nym-vpnd-x86_64
            artifacts/nym-vpnd-i686
            artifacts/nym-vpnd-aarch64
            artifacts/nym-vpnd-armv7
            artifacts/nym-vpnd-mips
            artifacts/nym-vpnd-mipsel
            artifacts/nym-vpnd-riscv64
            artifacts/nym-vpnd-armv5te
            artifacts/nym-vpnc-x86_64
            artifacts/nym-vpnc-i686
            artifacts/nym-vpnc-aarch64
            artifacts/nym-vpnc-armv7
            artifacts/nym-vpnc-mips
            artifacts/nym-vpnc-mipsel
            artifacts/nym-vpnc-riscv64
            artifacts/nym-vpnc-armv5te
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.ipk
          body: |
            ## Nym VPN ${{ steps.version.outputs.version }} - OpenWRT Edition

            Pre-built static binaries and IPK packages for OpenWRT routers.

            ### Requirements

            - **Free space:** ~60MB minimum (see table below for exact sizes)
            - **WireGuard:** Must be installed first

            ```bash
            opkg update
            opkg install wireguard-tools kmod-wireguard
            ```

            ### Installation

            **Option 1: Via SSH**

            ```bash
            cd /tmp
            wget <IPK_URL>
            opkg install nym-vpn_*.ipk
            ```

            **Option 2: Via LuCI Web Interface**

            1. Download the `.ipk` file for your architecture to your computer
            2. Open LuCI (your router's web interface)
            3. Go to **System → Software**
            4. Click **Upload Package** and select the downloaded `.ipk` file
            5. Click **Install**

            ### After Installation

            Access the Nym VPN interface at: **LuCI → VPN → Nym VPN**

            ### Supported Architectures

            | Architecture | Installed Size | Example Devices |
            |--------------|----------------|-----------------|
            | `x86_64` | ~58MB | x86 VMs, PC Engines APU |
            | `i386_pentium4` | ~53MB | Older x86 devices |
            | `aarch64_generic` | ~54MB | Raspberry Pi 3/4, modern ARM64 routers |
            | `aarch64_cortex-a53` | ~54MB | MediaTek, Qualcomm ARM64 routers |
            | `arm_cortex-a7_neon-vfpv4` | ~55MB | Many MediaTek/Qualcomm routers |
            | `arm_cortex-a9_vfpv3-d16` | ~55MB | Linksys WRT, Netgear R7800 |
            | `arm_cortex-a9` | ~44MB | Older Cortex-A9 devices |
            | `arm_arm926ej-s` | ~44MB | Legacy ARM devices |
            | `mips_24kc` | ~59MB | Atheros/Qualcomm MIPS routers |
            | `mipsel_24kc` | ~59MB | MediaTek MIPS routers |
            | `mips_siflower` | ~59MB | GL.iNet SFT1200, SiFlower SF19A28 |
            | `riscv64` | ~40MB | RISC-V devices |

            Check your architecture: `opkg print-architecture | grep -v all`
