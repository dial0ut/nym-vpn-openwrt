# Build and release musl binaries and packages for OpenWrt.
#
# A v* tag runs everything. Manual dispatch with a tag is a dry run of the
# same pipeline from that tag: it builds, packages and smoke-tests an
# unsigned feed, and never releases or publishes.
name: Release musl binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.21.0)'
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag, version, and branches
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "Verifying $TAG (version $VERSION)"

          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag $TAG does not exist"; exit 1; }

          CARGO_VERSION=$(git show "$TAG:nym-vpn-core/Cargo.toml" | grep -m1 '^version = ' | cut -d'"' -f2)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match workspace version $CARGO_VERSION in nym-vpn-core/Cargo.toml"
            exit 1
          fi

          git fetch origin develop openwrt
          git merge-base --is-ancestor "$TAG" origin/develop \
            || { echo "::error::tagged commit is not on develop"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/openwrt \
            || { echo "::error::tagged commit is not on openwrt"; exit 1; }

          git show "$TAG:CHANGELOG.md" | grep -q "^## \[$VERSION\]" \
            || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

          # A semver pre-release suffix (v1.2.0-rc1) ships to GitHub as a
          # pre-release and never reaches the feed.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "All release invariants hold."

  build:
    name: Build
    needs: verify
    # Switch to the `$/` self-repository syntax once actionlint and act support it.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      ref: refs/tags/${{ needs.verify.outputs.tag }}

  package:
    name: Create packages
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nym-vpn-*
          path: artifacts
          merge-multiple: true

      - name: Build IPK and APK packages
        # One .ipk (OpenWrt <=24.10, opkg) and one .apk (25.x+, apk) for every
        # OpenWrt architecture in scripts/ci/targets.json.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          while read -r arch openwrt_arch; do
            echo "::group::$openwrt_arch ($arch)"
            mkdir -p "bin/$arch"
            cp "artifacts/nym-vpnd-$arch" "bin/$arch/nym-vpnd"
            cp "artifacts/nym-vpnc-$arch" "bin/$arch/nym-vpnc"
            scripts/ipk/build-ipk.sh "$VERSION" "$openwrt_arch" "bin/$arch" luci-app-nym-vpn packages
            scripts/apk/build-apk.sh "$VERSION" "$openwrt_arch" "bin/$arch" luci-app-nym-vpn packages
            echo "::endgroup::"
          done < <(jq -r '.[] | .arch as $a | .openwrt[] | "\($a) \(.)"' scripts/ci/targets.json)

          expected=$(jq '[.[].openwrt[]] | length' scripts/ci/targets.json)
          for ext in ipk apk; do
            n=$(find packages -maxdepth 1 -name "*.$ext" | wc -l)
            [ "$n" -eq "$expected" ] \
              || { echo "::error::$n .$ext packages, expected $expected"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  feed:
    name: Build and smoke-test the feed
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Only a tag signs; a dry run builds the same feed unsigned.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts

      - name: Install signify
        if: env.SIGN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends signify-openbsd

      - name: Write signing keys
        if: env.SIGN == 'true'
        # Keys reach the shell through the environment, never by interpolating
        # the secret into the command line.
        env:
          OPKG_SIGNING_KEY: ${{ secrets.DIAL0UT_OPKG }}
          APK_SIGNING_KEY: ${{ secrets.DIAL0UT_APK }}
        run: |
          umask 077
          printf '%s\n' "$OPKG_SIGNING_KEY" > /tmp/opkg.sec
          # Basename must match the public key shipped on-device
          # (/etc/apk/keys/dial0ut-apk.pem) — apk matches signatures by key name.
          printf '%s\n' "$APK_SIGNING_KEY" > /tmp/dial0ut-apk.pem

      - name: Generate opkg and apk feeds
        run: |
          OPKG_KEY="" APK_KEY=""
          if [ "$SIGN" = true ]; then
            OPKG_KEY=/tmp/opkg.sec APK_KEY=/tmp/dial0ut-apk.pem
          else
            echo "::notice::not a tag: the feed is built unsigned"
          fi
          mkdir -p feed/opkg feed/apk
          cp artifacts/*.ipk feed/opkg/
          cp artifacts/*.apk feed/apk/
          bash scripts/feed/generate-feed.sh opkg feed/opkg "$OPKG_KEY"
          bash scripts/feed/generate-feed.sh apk feed/apk "$APK_KEY"

      - name: Clean up signing keys
        if: always()
        run: rm -f /tmp/opkg.sec /tmp/dial0ut-apk.pem

      - name: Check every architecture has an index
        # generate-feed.sh skips what it cannot index or sign with a warning;
        # a release must not publish a feed with holes in it.
        run: |
          expected=$(jq '[.[].openwrt[]] | length' scripts/ci/targets.json)
          check() {
            n=$(find "$1" -mindepth 2 -maxdepth 2 -name "$2" | wc -l)
            [ "$n" -eq "$expected" ] \
              || { echo "::error::$n of $expected architectures have $1/*/$2"; exit 1; }
          }
          check feed/opkg Packages.gz
          check feed/apk packages.adb
          if [ "$SIGN" = true ]; then
            check feed/opkg Packages.sig
          fi
          echo "All $expected architectures indexed."

      - name: Smoke-test the apk feed with a real apk client
        run: |
          # Nothing else in this pipeline ever consumes the feed it publishes,
          # which is how a filename mismatch went unnoticed for four releases:
          # apk stores no filename in packages.adb and rebuilds the URL as
          # <name>-<version>.apk, so a feed holding only nym-vpn_<ver>_<arch>.apk
          # 404s on every `apk add/upgrade` while looking perfectly healthy.
          # Serve the generated feed locally and make apk actually fetch from it.
          set -euo pipefail
          source scripts/versions.sh
          ( cd feed/apk && python3 -m http.server 8899 --bind 127.0.0.1 & )
          # `cmd && break` would abort the whole step under set -e on the
          # first miss, which is exactly when we still need to wait.
          for _ in $(seq 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8899/"; then break; fi
            sleep 1
          done

          # A tag trusts the index only via the public key we ship on-device,
          # so this also catches a signing-key regression. A dry run's feed is
          # unsigned.
          trust=(-v "$PWD/scripts/feed/dial0ut-apk.pem:/etc/apk/keys/dial0ut-apk.pem:ro")
          untrusted=""
          if [ "$SIGN" != true ]; then
            trust=()
            untrusted="--allow-untrusted"
          fi

          failed=0
          for arch_dir in feed/apk/*/; do
            arch="$(basename "$arch_dir")"
            [ -f "$arch_dir/packages.adb" ] || continue
            echo "::group::apk fetch nym-vpn ($arch)"
            # --arch so one runner can exercise every published architecture.
            if docker run --rm --network host "${trust[@]}" "$ALPINE_IMAGE" sh -c "
                   set -e
                   echo 'http://127.0.0.1:8899/$arch/packages.adb' > /etc/apk/repositories
                   apk update $untrusted
                   apk fetch $untrusted --arch '$arch' -o /tmp nym-vpn
                   ls -la /tmp/nym-vpn-*.apk
                 "; then
              echo "  OK: $arch"
            else
              echo "::error::apk cannot fetch nym-vpn from the $arch feed"
              failed=1
            fi
            echo "::endgroup::"
          done

          pkill -f "http.server 8899" || true
          [ "$failed" -eq 0 ]

      - name: Upload feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed
          path: feed/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: [verify, package, feed]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nym-vpn-*
          path: dist
          merge-multiple: true

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Add the install script
        run: |
          cp scripts/install.sh dist/
          ls -la dist/

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Print the "## [VERSION]" section of CHANGELOG.md (up to the next "## [")
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > /tmp/changelog.md

          if [ ! -s /tmp/changelog.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            cat /tmp/changelog.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Nym VPN ${{ needs.verify.outputs.tag }}
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: dist/*
          body: |
            ## Nym VPN ${{ needs.verify.outputs.tag }} for OpenWrt

            ${{ steps.changelog.outputs.changelog }}

            ---

            ### Quick Install

            ```bash
            curl -fsSL https://packages.dial0ut.org/install.sh | sh
            ```

            Auto-detects your architecture and package manager (`opkg` or `apk`), downloads the latest release, and installs everything.

            ### Manual Install

            Download the `.ipk` (OpenWrt ≤24.10) or `.apk` (OpenWrt 25.x+) for your architecture from the assets below, then:

            ```bash
            # opkg (OpenWrt ≤24.10)
            opkg update && opkg install ./nym-vpn_*.ipk

            # apk (OpenWrt 25.x+)
            apk add --allow-untrusted ./nym-vpn_*.apk
            ```

            Dependencies (`kmod-tun`, `luci-base`) are installed automatically. Uses pure Rust userspace WireGuard — no kernel WireGuard module needed.

            ### After Installation

            Access the web interface at: **LuCI → VPN → Nym VPN**

            ### Supported Architectures

            | Architecture | Example Devices |
            |--------------|-----------------|
            | `aarch64_generic` | Raspberry Pi 3/4, modern ARM64 routers |
            | `aarch64_cortex-a53` | MediaTek, Qualcomm ARM64 routers |
            | `aarch64_cortex-a53_neon-vfpv4` | ARM64 Cortex-A53 with NEON/VFPv4 |
            | `aarch64_cortex-a72` | Raspberry Pi 4, Marvell Armada |
            | `arm_cortex-a5_vfpv4` | Marvell Armada 375 |
            | `arm_cortex-a7` | GL.iNet Flint, custom ARM builds |
            | `arm_cortex-a7_neon-vfpv4` | Many MediaTek/Qualcomm routers |
            | `arm_cortex-a7_vfpv4` | Zyxel, some MediaTek routers |
            | `arm_cortex-a8_vfpv3` | TI AM335x, BeagleBone |
            | `arm_cortex-a9` | Broadcom BCM47xx, older Netgear |
            | `arm_cortex-a9_neon` | Zyxel NBG6817, some Marvell |
            | `arm_cortex-a9_vfpv3-d16` | Linksys WRT, Netgear R7800 |
            | `arm_cortex-a15_neon-vfpv4` | TI OMAP5, Samsung Exynos |
            | `arm_arm926ej-s` | Marvell Kirkwood (Linksys EA3500, Seagate GoFlex) |
            | `x86_64` | x86 VMs, PC Engines APU |
            | `i386_pentium4` | Older x86 devices |
            | `i386_pentium-mmx` | Legacy x86 devices |
            | `mipsel_24kc` | MediaTek MT7621 routers (GL.iNet, Xiaomi) |
            | `mips_24kc` | Atheros/Qualcomm routers (AR71xx, QCA9xxx) |
            | `mips_siflower` | Siflower SF19A28 (GL.iNet SFT1200) |
            | `riscv64_riscv64` | SiFive, StarFive VisionFive |

            Check your architecture: `grep OPENWRT_ARCH /etc/os-release` or `opkg print-architecture | grep -v all`

            ### Package Feed (automatic updates)

            The install script registers the feed automatically. To add it manually:

            ```bash
            ARCH=$(grep OPENWRT_ARCH /etc/os-release | cut -d'"' -f2)

            # opkg
            echo "src/gz nym-vpn https://packages.dial0ut.org/opkg/$ARCH" >> /etc/opkg/customfeeds.conf

            # apk (point directly at the packages.adb index, like OpenWrt's own distfeeds.list)
            echo "https://packages.dial0ut.org/apk/$ARCH/packages.adb" > /etc/apk/repositories.d/nym-vpn.list
            ```

  publish-feed:
    name: Publish package feed
    needs: [verify, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.verify.outputs.prerelease == 'false'
    timeout-minutes: 20
    permissions:
      contents: read
    # Two releases never sync at once; with the newest-release check below,
    # whichever finishes last cannot roll the feed back.
    concurrency:
      group: publish-feed
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feed
          path: feed

      - name: Only the newest release updates the feed
        id: newest
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # Checked now, not at verify time: a newer tag may have been pushed
          # (or this may be a re-run of an old release) since.
          newest=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$TAG" = "$newest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not the newest release ($newest); the feed is left alone"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Cloudflare R2
        if: steps.newest.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: scripts/feed/publish-r2.sh feed "$TAG"
