# Build and release musl binaries for OpenWrt/Linux
name: Release musl binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.21.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Tier 2 targets - use stock messense/rust-musl-cross images
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            docker_image: messense/rust-musl-cross:x86_64-musl
          - target: i686-unknown-linux-musl
            arch: i686
            docker_image: messense/rust-musl-cross:i686-musl
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            docker_image: messense/rust-musl-cross:aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            docker_image: messense/rust-musl-cross:armv7-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup swap for LTO linking
        run: |
          # Use a unique swapfile name to avoid conflicts
          SWAPFILE="/swapfile-nym-$$"
          sudo fallocate -l 8G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "Swap enabled:"
          free -h

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            -e TARGET=${{ matrix.target }} \
            ${{ matrix.docker_image }} \
            bash /home/rust/src/scripts/cross-compile-musl.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnd artifacts/nym-vpnd-${{ matrix.arch }}
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnc artifacts/nym-vpnc-${{ matrix.arch }}

          # Create tarball
          cd artifacts
          tar -czvf nym-vpn-${{ matrix.arch }}.tar.gz nym-vpnd-${{ matrix.arch }} nym-vpnc-${{ matrix.arch }}

          # Generate checksums
          sha256sum nym-vpnd-${{ matrix.arch }} > nym-vpnd-${{ matrix.arch }}.sha256
          sha256sum nym-vpnc-${{ matrix.arch }} > nym-vpnc-${{ matrix.arch }}.sha256
          sha256sum nym-vpn-${{ matrix.arch }}.tar.gz > nym-vpn-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 7

  package-ipk:
    name: Create IPK packages
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # aarch64
          - arch: aarch64
            openwrt_arch: aarch64_generic
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a53
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a72
          # x86
          - arch: x86_64
            openwrt_arch: x86_64
          - arch: i686
            openwrt_arch: i386_pentium4
          - arch: i686
            openwrt_arch: i386_pentium-mmx
          # armv7
          - arch: armv7
            openwrt_arch: arm_cortex-a5_vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a7
          - arch: armv7
            openwrt_arch: arm_cortex-a7_neon-vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a7_vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a8_vfpv3
          - arch: armv7
            openwrt_arch: arm_cortex-a9
          - arch: armv7
            openwrt_arch: arm_cortex-a9_neon
          - arch: armv7
            openwrt_arch: arm_cortex-a9_vfpv3-d16
          - arch: armv7
            openwrt_arch: arm_cortex-a15_neon-vfpv4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip 'v' prefix for package version
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Clone LuCI package
        run: |
          # Try to clone the matching release tag, fall back to main branch
          if git clone --depth 1 --branch "v${{ steps.version.outputs.version }}" \
               https://github.com/dial0ut/nym-vpn-luci.git luci 2>/dev/null; then
            echo "Cloned LuCI repo at tag v${{ steps.version.outputs.version }}"
          else
            echo "Tag not found, cloning main branch"
            git clone --depth 1 https://github.com/dial0ut/nym-vpn-luci.git luci
          fi

      - name: Prepare binaries
        run: |
          mkdir -p binaries
          cp artifacts/nym-vpnd-${{ matrix.arch }} binaries/nym-vpnd
          cp artifacts/nym-vpnc-${{ matrix.arch }} binaries/nym-vpnc

      - name: Build IPK
        run: |
          scripts/ipk/build-ipk.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.openwrt_arch }}" \
            "binaries" \
            "luci" \
            "."

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.openwrt_arch }}
          path: "*.ipk"
          retention-days: 7

  release:
    name: Create Release
    needs: [build, package-ipk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Nym VPN ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            artifacts/nym-vpnd-x86_64
            artifacts/nym-vpnd-i686
            artifacts/nym-vpnd-aarch64
            artifacts/nym-vpnd-armv7
            artifacts/nym-vpnc-x86_64
            artifacts/nym-vpnc-i686
            artifacts/nym-vpnc-aarch64
            artifacts/nym-vpnc-armv7
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.ipk
          body: |
            ## Nym VPN ${{ steps.version.outputs.version }} - OpenWRT Edition

            Pre-built static binaries and IPK packages for OpenWRT routers.

            ### Requirements

            - **Free space:** ~60MB minimum (see table below for exact sizes)
            - **Package feeds:** Run `opkg update` before installing

            ### Installation

            **Option 1: Via SSH**

            ```bash
            cd /tmp
            opkg update
            wget <IPK_URL>
            opkg install nym-vpn_*.ipk
            ```

            **Option 2: Via LuCI Web Interface**

            1. Download the `.ipk` file for your architecture to your computer
            2. SSH into your router and run `opkg update`
            3. Open LuCI (your router's web interface)
            4. Go to **System → Software**
            5. Click **Upload Package** and select the downloaded `.ipk` file
            6. Click **Install**

            Dependencies (kmod-tun, kmod-wireguard, luci-base) are installed automatically.

            On OpenWrt 23.05+, Amnezia-WireGuard is installed on first reboot for obfuscation support.

            ### After Installation

            Access the Nym VPN interface at: **LuCI → VPN → Nym VPN**

            ### Supported Architectures

            | Architecture | Example Devices |
            |--------------|-----------------|
            | `x86_64` | x86 VMs, PC Engines APU |
            | `i386_pentium4` | Older x86 devices |
            | `i386_pentium-mmx` | Legacy x86 devices |
            | `aarch64_generic` | Raspberry Pi 3/4, modern ARM64 routers |
            | `aarch64_cortex-a53` | MediaTek, Qualcomm ARM64 routers |
            | `aarch64_cortex-a72` | Raspberry Pi 4, Marvell Armada |
            | `arm_cortex-a5_vfpv4` | Marvell Armada 375 |
            | `arm_cortex-a7` | GL.iNet Flint, custom ARM builds |
            | `arm_cortex-a7_neon-vfpv4` | Many MediaTek/Qualcomm routers |
            | `arm_cortex-a7_vfpv4` | Zyxel, some MediaTek routers |
            | `arm_cortex-a8_vfpv3` | TI AM335x, BeagleBone |
            | `arm_cortex-a9` | Broadcom BCM47xx, older Netgear |
            | `arm_cortex-a9_neon` | Zyxel NBG6817, some Marvell |
            | `arm_cortex-a9_vfpv3-d16` | Linksys WRT, Netgear R7800 |
            | `arm_cortex-a15_neon-vfpv4` | TI OMAP5, Samsung Exynos |

            Check your architecture: `opkg print-architecture | grep -v all`
