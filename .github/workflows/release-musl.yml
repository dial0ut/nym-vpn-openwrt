# Build and release musl binaries for OpenWrt/Linux
name: Release musl binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.21.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag, version, and branches
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "Verifying $TAG (version $VERSION)"

          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag $TAG does not exist"; exit 1; }

          CARGO_VERSION=$(git show "$TAG:nym-vpn-core/Cargo.toml" | grep -m1 '^version = ' | cut -d'"' -f2)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match workspace version $CARGO_VERSION in nym-vpn-core/Cargo.toml"
            exit 1
          fi

          git fetch origin develop openwrt
          git merge-base --is-ancestor "$TAG" origin/develop \
            || { echo "::error::tagged commit is not on develop"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/openwrt \
            || { echo "::error::tagged commit is not on openwrt"; exit 1; }

          git show "$TAG:CHANGELOG.md" | grep -q "^## \[$VERSION\]" \
            || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

          echo "All release invariants hold."

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Tier 2 targets - use stock messense/rust-musl-cross images
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            docker_image: messense/rust-musl-cross:x86_64-musl
          - target: i686-unknown-linux-musl
            arch: i686
            docker_image: messense/rust-musl-cross:i686-musl
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            docker_image: messense/rust-musl-cross:aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            docker_image: messense/rust-musl-cross:armv7-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup swap for LTO linking
        run: |
          # Use a unique swapfile name to avoid conflicts
          SWAPFILE="/swapfile-nym-$$"
          sudo fallocate -l 8G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "Swap enabled:"
          free -h

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            -e TARGET=${{ matrix.target }} \
            ${{ matrix.docker_image }} \
            bash /home/rust/src/scripts/cross-compile-dynamic.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnd artifacts/nym-vpnd-${{ matrix.arch }}
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnc artifacts/nym-vpnc-${{ matrix.arch }}

          # Create tarball
          cd artifacts
          tar -czvf nym-vpn-${{ matrix.arch }}.tar.gz nym-vpnd-${{ matrix.arch }} nym-vpnc-${{ matrix.arch }}

          # Generate checksums
          sha256sum nym-vpnd-${{ matrix.arch }} > nym-vpnd-${{ matrix.arch }}.sha256
          sha256sum nym-vpnc-${{ matrix.arch }} > nym-vpnc-${{ matrix.arch }}.sha256
          sha256sum nym-vpn-${{ matrix.arch }}.tar.gz > nym-vpn-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 7

  build-tier3:
    name: Build ${{ matrix.arch }} (Tier 3)
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mipsel-unknown-linux-musl
            arch: mipsel
            dockerfile: Dockerfile.mipsel
          - target: mips-unknown-linux-musl
            arch: mips
            dockerfile: Dockerfile.mips
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            dockerfile: Dockerfile.riscv64
          - target: armv5te-unknown-linux-musleabi
            arch: armv5te
            dockerfile: Dockerfile.armv5te

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup swap for Tier 3 linking
        run: |
          SWAPFILE="/swapfile-nym-$$"
          sudo fallocate -l 8G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "Swap enabled:"
          free -h

      - name: Build Docker image
        run: |
          docker build \
            -f docker/tier3-musl/${{ matrix.dockerfile }} \
            -t nym-musl-cross:${{ matrix.arch }}-musl \
            docker/tier3-musl/

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/rust/src" \
            nym-musl-cross:${{ matrix.arch }}-musl \
            /opt/build-tier3-dynamic.sh

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnd artifacts/nym-vpnd-${{ matrix.arch }}
          cp nym-vpn-core/target/${{ matrix.target }}/release/nym-vpnc artifacts/nym-vpnc-${{ matrix.arch }}

          # Create tarball
          cd artifacts
          tar -czvf nym-vpn-${{ matrix.arch }}.tar.gz nym-vpnd-${{ matrix.arch }} nym-vpnc-${{ matrix.arch }}

          # Generate checksums
          sha256sum nym-vpnd-${{ matrix.arch }} > nym-vpnd-${{ matrix.arch }}.sha256
          sha256sum nym-vpnc-${{ matrix.arch }} > nym-vpnc-${{ matrix.arch }}.sha256
          sha256sum nym-vpn-${{ matrix.arch }}.tar.gz > nym-vpn-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 7

  package:
    name: Create packages (${{ matrix.openwrt_arch }})
    needs: [build, build-tier3]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # mipsel
          - arch: mipsel
            openwrt_arch: mipsel_24kc
          # mips
          - arch: mips
            openwrt_arch: mips_24kc
          - arch: mipsel
            openwrt_arch: mips_siflower
          # riscv64
          - arch: riscv64
            openwrt_arch: riscv64_riscv64
          # armv5te
          - arch: armv5te
            openwrt_arch: arm_arm926ej-s
          # aarch64
          - arch: aarch64
            openwrt_arch: aarch64_generic
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a53
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a53_neon-vfpv4
          - arch: aarch64
            openwrt_arch: aarch64_cortex-a72
          # x86
          - arch: x86_64
            openwrt_arch: x86_64
          - arch: i686
            openwrt_arch: i386_pentium4
          - arch: i686
            openwrt_arch: i386_pentium-mmx
          # armv7
          - arch: armv7
            openwrt_arch: arm_cortex-a5_vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a7
          - arch: armv7
            openwrt_arch: arm_cortex-a7_neon-vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a7_vfpv4
          - arch: armv7
            openwrt_arch: arm_cortex-a8_vfpv3
          - arch: armv7
            openwrt_arch: arm_cortex-a9
          - arch: armv7
            openwrt_arch: arm_cortex-a9_neon
          - arch: armv7
            openwrt_arch: arm_cortex-a9_vfpv3-d16
          - arch: armv7
            openwrt_arch: arm_cortex-a15_neon-vfpv4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip 'v' prefix for package version
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare binaries
        run: |
          mkdir -p binaries
          cp artifacts/nym-vpnd-${{ matrix.arch }} binaries/nym-vpnd
          cp artifacts/nym-vpnc-${{ matrix.arch }} binaries/nym-vpnc

      - name: Build IPK (for OpenWrt ≤24.10 with opkg)
        run: |
          scripts/ipk/build-ipk.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.openwrt_arch }}" \
            "binaries" \
            "luci-app-nym-vpn" \
            "."

      - name: Build APK (for OpenWrt 25.x+ with apk)
        run: |
          scripts/apk/build-apk.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.openwrt_arch }}" \
            "binaries" \
            "luci-app-nym-vpn" \
            "."

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.openwrt_arch }}
          path: |
            *.ipk
            *.apk
          retention-days: 7

  release:
    name: Create Release
    needs: [build, build-tier3, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"

          # Print the "## [VERSION]" section of CHANGELOG.md (up to the next "## [")
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > /tmp/changelog.md

          if [ ! -s /tmp/changelog.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            cat /tmp/changelog.md
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Nym VPN ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            artifacts/nym-vpnd-x86_64
            artifacts/nym-vpnd-i686
            artifacts/nym-vpnd-aarch64
            artifacts/nym-vpnd-armv7
            artifacts/nym-vpnd-mipsel
            artifacts/nym-vpnd-mips
            artifacts/nym-vpnd-riscv64
            artifacts/nym-vpnd-armv5te
            artifacts/nym-vpnc-x86_64
            artifacts/nym-vpnc-i686
            artifacts/nym-vpnc-aarch64
            artifacts/nym-vpnc-armv7
            artifacts/nym-vpnc-mipsel
            artifacts/nym-vpnc-mips
            artifacts/nym-vpnc-riscv64
            artifacts/nym-vpnc-armv5te
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.ipk
            artifacts/*.apk
            scripts/install.sh
          body: |
            ## Nym VPN ${{ steps.version.outputs.version }} for OpenWrt

            ${{ steps.changelog.outputs.changelog }}

            ---

            ### Quick Install

            ```bash
            curl -fsSL https://packages.dial0ut.org/install.sh | sh
            ```

            Auto-detects your architecture and package manager (`opkg` or `apk`), downloads the latest release, and installs everything.

            ### Manual Install

            Download the `.ipk` (OpenWrt ≤24.10) or `.apk` (OpenWrt 25.x+) for your architecture from the assets below, then:

            ```bash
            # opkg (OpenWrt ≤24.10)
            opkg update && opkg install ./nym-vpn_*.ipk

            # apk (OpenWrt 25.x+)
            apk add --allow-untrusted ./nym-vpn_*.apk
            ```

            Dependencies (`kmod-tun`, `luci-base`) are installed automatically. Uses pure Rust userspace WireGuard — no kernel WireGuard module needed.

            ### After Installation

            Access the web interface at: **LuCI → VPN → Nym VPN**

            ### Supported Architectures

            | Architecture | Example Devices |
            |--------------|-----------------|
            | `aarch64_generic` | Raspberry Pi 3/4, modern ARM64 routers |
            | `aarch64_cortex-a53` | MediaTek, Qualcomm ARM64 routers |
            | `aarch64_cortex-a53_neon-vfpv4` | ARM64 Cortex-A53 with NEON/VFPv4 |
            | `aarch64_cortex-a72` | Raspberry Pi 4, Marvell Armada |
            | `arm_cortex-a5_vfpv4` | Marvell Armada 375 |
            | `arm_cortex-a7` | GL.iNet Flint, custom ARM builds |
            | `arm_cortex-a7_neon-vfpv4` | Many MediaTek/Qualcomm routers |
            | `arm_cortex-a7_vfpv4` | Zyxel, some MediaTek routers |
            | `arm_cortex-a8_vfpv3` | TI AM335x, BeagleBone |
            | `arm_cortex-a9` | Broadcom BCM47xx, older Netgear |
            | `arm_cortex-a9_neon` | Zyxel NBG6817, some Marvell |
            | `arm_cortex-a9_vfpv3-d16` | Linksys WRT, Netgear R7800 |
            | `arm_cortex-a15_neon-vfpv4` | TI OMAP5, Samsung Exynos |
            | `arm_arm926ej-s` | Marvell Kirkwood (Linksys EA3500, Seagate GoFlex) |
            | `x86_64` | x86 VMs, PC Engines APU |
            | `i386_pentium4` | Older x86 devices |
            | `i386_pentium-mmx` | Legacy x86 devices |
            | `mipsel_24kc` | MediaTek MT7621 routers (GL.iNet, Xiaomi) |
            | `mips_24kc` | Atheros/Qualcomm routers (AR71xx, QCA9xxx) |
            | `mips_siflower` | Siflower SF19A28 (GL.iNet SFT1200) |
            | `riscv64_riscv64` | SiFive, StarFive VisionFive |

            Check your architecture: `grep OPENWRT_ARCH /etc/os-release` or `opkg print-architecture | grep -v all`

            ### Package Feed (automatic updates)

            The install script registers the feed automatically. To add it manually:

            ```bash
            ARCH=$(grep OPENWRT_ARCH /etc/os-release | cut -d'"' -f2)

            # opkg
            echo "src/gz nym-vpn https://packages.dial0ut.org/opkg/$ARCH" >> /etc/opkg/customfeeds.conf

            # apk (point directly at the packages.adb index, like OpenWrt's own distfeeds.list)
            echo "https://packages.dial0ut.org/apk/$ARCH/packages.adb" > /etc/apk/repositories.d/nym-vpn.list
            ```

  publish-feed:
    name: Publish package feed
    needs: [package, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: List downloaded packages
        run: ls -la artifacts/

      - name: Install signify
        run: sudo apt-get install -y -qq signify-openbsd

      - name: Write signing keys
        run: |
          echo "${{ secrets.DIAL0UT_OPKG }}" > /tmp/opkg.sec
          chmod 600 /tmp/opkg.sec
          # Basename must match the public key shipped on-device
          # (/etc/apk/keys/dial0ut-apk.pem) — apk matches signatures by key name.
          echo "${{ secrets.DIAL0UT_APK }}" > /tmp/dial0ut-apk.pem
          chmod 600 /tmp/dial0ut-apk.pem

      - name: Generate opkg feed
        run: |
          mkdir -p feed/opkg
          cp artifacts/*.ipk feed/opkg/ 2>/dev/null || true
          bash scripts/feed/generate-feed.sh opkg feed/opkg /tmp/opkg.sec

      - name: Generate apk feed
        run: |
          mkdir -p feed/apk
          cp artifacts/*.apk feed/apk/ 2>/dev/null || true
          bash scripts/feed/generate-feed.sh apk feed/apk /tmp/dial0ut-apk.pem

      - name: Smoke-test the apk feed with a real apk client
        run: |
          # Nothing else in this pipeline ever consumes the feed it publishes,
          # which is how a filename mismatch went unnoticed for four releases:
          # apk stores no filename in packages.adb and rebuilds the URL as
          # <name>-<version>.apk, so a feed holding only nym-vpn_<ver>_<arch>.apk
          # 404s on every `apk add/upgrade` while looking perfectly healthy.
          # Serve the generated feed locally and make apk actually fetch from it.
          set -euo pipefail
          ( cd feed/apk && python3 -m http.server 8899 --bind 127.0.0.1 & )
          # `cmd && break` would abort the whole step under set -e on the
          # first miss, which is exactly when we still need to wait.
          for _ in $(seq 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8899/"; then break; fi
            sleep 1
          done

          failed=0
          for arch_dir in feed/apk/*/; do
            arch="$(basename "$arch_dir")"
            [ -f "$arch_dir/packages.adb" ] || continue
            echo "::group::apk fetch nym-vpn ($arch)"
            # --arch so one runner can exercise every published architecture.
            # The index is signed; trust it via the public key we ship on-device,
            # so this also catches a signing-key regression.
            if docker run --rm --network host \
                 -v "$PWD/scripts/feed/dial0ut-apk.pem:/etc/apk/keys/dial0ut-apk.pem:ro" \
                 alpine:edge sh -c "
                   set -e
                   echo 'http://127.0.0.1:8899/$arch/packages.adb' > /etc/apk/repositories
                   apk update
                   apk fetch --arch '$arch' -o /tmp nym-vpn
                   ls -la /tmp/nym-vpn-*.apk
                 "; then
              echo "  OK: $arch"
            else
              echo "::error::apk cannot fetch nym-vpn from the $arch feed"
              failed=1
            fi
            echo "::endgroup::"
          done

          pkill -f "http.server 8899" || true
          [ "$failed" -eq 0 ]

      - name: Clean up signing keys
        if: always()
        run: rm -f /tmp/opkg.sec /tmp/dial0ut-apk.pem

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
        run: |
          # Upload install script
          aws s3 cp scripts/install.sh s3://${{ secrets.R2_BUCKET }}/install.sh \
            --endpoint-url "$R2_ENDPOINT"

          # Upload latest version marker
          echo "${{ steps.version.outputs.version }}" > /tmp/latest
          aws s3 cp /tmp/latest s3://${{ secrets.R2_BUCKET }}/latest \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/plain"

          # Upload opkg feed
          aws s3 sync feed/opkg/ s3://${{ secrets.R2_BUCKET }}/opkg/ \
            --endpoint-url "$R2_ENDPOINT" \
            --delete

          # Upload apk feed
          aws s3 sync feed/apk/ s3://${{ secrets.R2_BUCKET }}/apk/ \
            --endpoint-url "$R2_ENDPOINT" \
            --delete
