# Build OpenWrt firmware images with NymVPN pre-installed
name: Build OpenWrt Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NymVPN version (e.g., v0.2.4)'
        required: true
        type: string
      openwrt_version:
        description: 'OpenWrt version'
        required: true
        default: '24.10.2'
        type: string

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version }}
  NYM_VERSION: ${{ inputs.version }}

jobs:
  build-image:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== x86_64 - VMs and PC routers =====
          - target: x86/64
            ipk_arch: x86_64
            profile: generic

          # ===== aarch64 - Popular ARM64 devices =====
          - target: rockchip/armv8
            ipk_arch: aarch64_generic
            profile: friendlyarm_nanopi-r4s

          - target: rockchip/armv8
            ipk_arch: aarch64_generic
            profile: friendlyarm_nanopi-r5s

          - target: mediatek/filogic
            ipk_arch: aarch64_cortex-a53
            profile: glinet_gl-mt6000

          - target: mediatek/filogic
            ipk_arch: aarch64_cortex-a53
            profile: bananapi_bpi-r3

          - target: qualcommax/ipq807x
            ipk_arch: aarch64_cortex-a53
            profile: linksys_mx4200v2

          # ===== arm_cortex-a7 - ARMv7 devices =====
          - target: ipq40xx/generic
            ipk_arch: arm_cortex-a7_neon-vfpv4
            profile: glinet_gl-b1300

          - target: ipq40xx/generic
            ipk_arch: arm_cortex-a7_neon-vfpv4
            profile: asus_rt-ac58u

          - target: mvebu/cortexa9
            ipk_arch: arm_cortex-a9_vfpv3-d16
            profile: linksys_wrt1900acs

          - target: mvebu/cortexa9
            ipk_arch: arm_cortex-a9_vfpv3-d16
            profile: cznic_turris-omnia

          # ===== arm_cortex-a9 - BCM53xx devices =====
          - target: bcm53xx/generic
            ipk_arch: arm_cortex-a9
            profile: netgear_r7000

          - target: bcm53xx/generic
            ipk_arch: arm_cortex-a9
            profile: asus_rt-ac68u

          # ===== mips_24kc - Atheros devices =====
          - target: ath79/generic
            ipk_arch: mips_24kc
            profile: tplink_archer-c7-v5

          - target: ath79/nand
            ipk_arch: mips_24kc
            profile: glinet_gl-ar750s-nor-nand

          # ===== mipsel_24kc - MediaTek MIPS devices =====
          - target: ramips/mt7621
            ipk_arch: mipsel_24kc
            profile: glinet_gl-mt1300

          - target: ramips/mt7621
            ipk_arch: mipsel_24kc
            profile: xiaomi_mi-router-3g-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: Download Image Builder
        run: |
          TARGET="${{ matrix.target }}"
          TARGET_PATH="${TARGET//\//-}"

          # Try zst first (newer releases), then xz (older releases)
          IB_BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}"
          IB_NAME="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET_PATH}.Linux-x86_64"

          if wget -q "${IB_BASE}/${IB_NAME}.tar.zst" -O imagebuilder.tar.zst; then
            tar --zstd -xf imagebuilder.tar.zst
          elif wget -q "${IB_BASE}/${IB_NAME}.tar.xz" -O imagebuilder.tar.xz; then
            tar xf imagebuilder.tar.xz
          else
            echo "Failed to download Image Builder for ${TARGET}"
            exit 1
          fi

          mv openwrt-imagebuilder-* imagebuilder
          ls -la imagebuilder/

      - name: Download NymVPN IPK
        run: |
          mkdir -p ipks

          # Download all IPKs from release
          gh release download "$NYM_VERSION" \
            --repo ${{ github.repository }} \
            --pattern "*.ipk" \
            --dir ipks/

          ls -la ipks/

          # Find the IPK matching this target's architecture
          IPK_ARCH="${{ matrix.ipk_arch }}"
          IPK=$(ls ipks/*_${IPK_ARCH}.ipk 2>/dev/null | head -1)

          if [ -z "$IPK" ]; then
            echo "ERROR: No IPK found for architecture: $IPK_ARCH"
            echo "Available IPKs:"
            ls -la ipks/
            exit 1
          fi

          echo "Using IPK: $IPK"
          cp "$IPK" imagebuilder/packages/

          # Write signing key and regenerate package index
          cd imagebuilder
          echo "$OPENWRT_SIGNING_KEY" > key-build

          # Add our public key to trusted keys
          echo "$OPENWRT_PUBLIC_KEY" > keys/nymvpn

          make package_index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENWRT_SIGNING_KEY: ${{ secrets.OPENWRT_SIGNING_KEY }}
          OPENWRT_PUBLIC_KEY: |
            untrusted comment: zm@dialout.net
            RWRaA3HWC86PC2oh5H1lp30ZRXT2SbliZjZUtLF5qaz7kEijvsXMbkQ1

      - name: Build image
        run: |
          cd imagebuilder

          # Base packages for NymVPN
          PACKAGES="nym-vpn"

          # WireGuard (kernel module + tools)
          PACKAGES="$PACKAGES kmod-wireguard wireguard-tools"

          # TUN device support
          PACKAGES="$PACKAGES kmod-tun"

          # LuCI web interface
          PACKAGES="$PACKAGES luci luci-base rpcd"

          # Useful networking
          PACKAGES="$PACKAGES ip-full"

          # Remove bloat to save space
          PACKAGES="$PACKAGES -ppp -ppp-mod-pppoe"

          echo "Building with packages: $PACKAGES"

          make image \
            PROFILE="${{ matrix.profile }}" \
            PACKAGES="$PACKAGES" \
            || { echo "Build failed"; cat logs/*; exit 1; }

      - name: Prepare artifacts
        run: |
          TARGET="${{ matrix.target }}"
          TARGET_SAFE="${TARGET//\//-}"
          PROFILE="${{ matrix.profile }}"

          mkdir -p artifacts

          # Find the output directory (varies by target)
          OUTPUT_DIR=$(find imagebuilder -type d -name "output" -path "*/image/*" | head -1)
          echo "Output directory: $OUTPUT_DIR"
          ls -la "$OUTPUT_DIR/"

          # Copy all firmware files (images, bins, itb)
          find "$OUTPUT_DIR" -maxdepth 1 -type f \( \
            -name "*.img.gz" -o \
            -name "*.bin" -o \
            -name "*.itb" \
          \) -exec cp {} artifacts/ \;

          cd artifacts
          echo "Files copied:"
          ls -la

          # Rename with profile prefix
          for f in *; do
            [ -f "$f" ] && mv "$f" "nymvpn-${PROFILE}-${f}"
          done

          echo "Final artifacts:"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.profile }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-image]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "All artifacts:"
          ls -laR artifacts/ || echo "No artifacts found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-${{ inputs.version }}
          name: NymVPN OpenWrt Firmware ${{ inputs.version }}
          draft: true
          prerelease: false
          files: artifacts/*
          body: |
            ## NymVPN OpenWrt Firmware Images

            Pre-built OpenWrt ${{ inputs.openwrt_version }} firmware with NymVPN ${{ inputs.version }} pre-installed.

            ### Installation

            1. Download the firmware for your device
            2. Flash via OpenWrt sysupgrade or bootloader (TFTP/serial)
            3. Access LuCI at http://192.168.1.1
            4. Go to **VPN → NymVPN** to configure

            ### Supported Devices

            | Device | Target | Architecture |
            |--------|--------|--------------|
            | Generic x86_64 | x86/64 | x86_64 |
            | FriendlyARM NanoPi R4S | rockchip/armv8 | aarch64 |
            | FriendlyARM NanoPi R5S | rockchip/armv8 | aarch64 |
            | GL.iNet GL-MT6000 | mediatek/filogic | aarch64 |
            | Banana Pi BPI-R3 | mediatek/filogic | aarch64 |
            | Linksys MX4200 v2 | qualcommax/ipq807x | aarch64 |
            | GL.iNet GL-B1300 | ipq40xx/generic | arm_cortex-a7 |
            | ASUS RT-AC58U | ipq40xx/generic | arm_cortex-a7 |
            | Linksys WRT1900ACS | mvebu/cortexa9 | arm_cortex-a7 |
            | Turris Omnia | mvebu/cortexa9 | arm_cortex-a7 |
            | Netgear R7000 | bcm53xx/generic | arm_cortex-a9 |
            | ASUS RT-AC68U | bcm53xx/generic | arm_cortex-a9 |
            | TP-Link Archer C7 v5 | ath79/generic | mips_24kc |
            | GL.iNet GL-AR750S | ath79/generic | mips_24kc |
            | GL.iNet GL-MT1300 | ramips/mt7621 | mipsel_24kc |
            | Xiaomi Mi Router 3G v2 | ramips/mt7621 | mipsel_24kc |

            **Don't see your device?** Install from IPK package instead - see the main release.

            ### What's Included

            - NymVPN daemon (`nym-vpnd`) and CLI (`nym-vpnc`)
            - LuCI web interface for NymVPN
            - WireGuard kernel module and tools
            - Full OpenWrt base system

            ### Note

            These are **complete firmware images** that replace your existing OpenWrt installation.
            Back up your configuration before flashing!
