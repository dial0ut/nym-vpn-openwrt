# Cross-build nym-vpnd and nym-vpnc in the pinned build images, one job per
# target in scripts/ci/targets.json. ci.yml builds a subset on every push;
# release-musl.yml builds all of them from the tag.
name: Build

on:
  workflow_call:
    inputs:
      arches:
        description: 'Space-separated arches from scripts/ci/targets.json, or "all"'
        type: string
        default: all
      ref:
        description: 'Ref to build (default: the commit that triggered the caller)'
        type: string
        default: ''

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Select targets
        id: plan
        env:
          ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          read -ra want <<< "$ARCHES"
          if [ "${want[*]}" = all ]; then
            matrix=$(jq -c 'map(del(.openwrt))' scripts/ci/targets.json)
          else
            for arch in "${want[@]}"; do
              jq -e --arg a "$arch" 'any(.[]; .arch == $a)' scripts/ci/targets.json >/dev/null \
                || { echo "::error::unknown arch '$arch' (see scripts/ci/targets.json)"; exit 1; }
            done
            matrix=$(jq -c --arg want "$ARCHES" \
              '($want | split(" ")) as $w | map(select(.arch | IN($w[])) | del(.openwrt))' \
              scripts/ci/targets.json)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up swap for LTO linking
        # Under act the host's memory and swap apply.
        if: ${{ !env.ACT }}
        run: |
          SWAPFILE="/swapfile-nym-$$"
          sudo fallocate -l 8G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          free -h

      - name: Build the Tier 3 image
        if: matrix.dockerfile
        env:
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          source scripts/versions.sh
          docker build \
            --build-arg RUST_NIGHTLY="$RUST_NIGHTLY" \
            -f "docker/tier3-musl/$DOCKERFILE" \
            -t "nym-musl-cross:$ARCH" \
            docker/tier3-musl/

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -n "$IMAGE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/home/rust/src" -e TARGET="$TARGET" \
              "$IMAGE" bash /home/rust/src/scripts/cross-compile-dynamic.sh
          else
            docker run --rm -v "$GITHUB_WORKSPACE:/home/rust/src" -e TARGET="$TARGET" \
              "nym-musl-cross:$ARCH" /opt/build-tier3-dynamic.sh
          fi

      - name: Check ELF imports and libraries
        # Needed libraries within the package's depends, imports within
        # musl 1.1.24 (plus time64 on 32-bit, which requires libc >= 1.2).
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/ci/check-elf.sh \
            "nym-vpn-core/target/${TARGET}/release/nym-vpnd" \
            "nym-vpn-core/target/${TARGET}/release/nym-vpnc"

      - name: Prepare artifacts
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          cp "nym-vpn-core/target/$TARGET/release/nym-vpnd" "artifacts/nym-vpnd-$ARCH"
          cp "nym-vpn-core/target/$TARGET/release/nym-vpnc" "artifacts/nym-vpnc-$ARCH"
          cd artifacts
          tar -czf "nym-vpn-$ARCH.tar.gz" "nym-vpnd-$ARCH" "nym-vpnc-$ARCH"
          for f in "nym-vpnd-$ARCH" "nym-vpnc-$ARCH" "nym-vpn-$ARCH.tar.gz"; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nym-vpn-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
