name: Deploy docs

on:
  push:
    branches: [openwrt]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # mkdocs gh-deploy pushes the gh-pages branch
    steps:
      # gh-deploy pushes with the checkout's token, so credentials must persist here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material

      - run: mkdocs gh-deploy --force
