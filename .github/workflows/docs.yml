name: Deploy docs

on:
  push:
    branches: [openwrt]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # mkdocs gh-deploy pushes the gh-pages branch
    steps:
      # gh-deploy pushes with the checkout's token, so credentials must persist here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # The same requirements and strictness as docs-check.yml, so what
      # passed there is what deploys.
      - run: pip install -r docs/requirements.txt

      - run: mkdocs gh-deploy --force --strict
